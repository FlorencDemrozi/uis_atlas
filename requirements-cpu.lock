# Exact versions for the Linux server (no GPU): the same packages and versions as
# requirements.lock, but PyTorch's CPU build instead of the CUDA one (about 1 GB
# instead of 6 GB; the embeddings are identical).
# Install: pip install -r requirements-cpu.lock
# Update together with requirements.lock (needs uv, https://docs.astral.sh/uv/):
#   uv pip compile requirements.txt --python-platform x86_64-manylinux_2_28 --python-version 3.12 \
#     --torch-backend cpu -c requirements.lock -o requirements-cpu.lock
