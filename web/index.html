<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep out of search engines until UiS Library / data protection confirmation (docs/DATA_POLICY.md). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Find researchers at the six faculties of the University of Stavanger." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>UiS Researcher Atlas</title>
    <script>
      // Apply the theme before first paint (see src/theme.ts): the saved choice, else the
      // operating system's light/dark setting.
      var t = null;
      try { t = localStorage.getItem("atlas-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark" && t !== "sepia")
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>The UiS Researcher Atlas needs JavaScript to search and display researchers.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
