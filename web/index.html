<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep out of search engines until UiS Library / data protection confirmation (docs/DATA_POLICY.md). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Find researchers at the Faculty of Science and Technology, University of Stavanger." />
    <title>UiS Researcher Atlas</title>
    <script>
      // Apply the saved light/dark choice before first paint (see src/theme.ts).
      try {
        var t = localStorage.getItem("atlas-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>The UiS Researcher Atlas needs JavaScript to search and display researchers.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
