# UiS Researcher Atlas: nginx site (installed by deploy/install.sh as
# /etc/nginx/sites-available/atlas). Plain HTTP on port 80; for HTTPS see the README
# ("HTTPS") and docs/DEPLOY.md.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @SERVER_NAME@;
    root @WEBROOT@;
    index index.html;

    # Compression: the data files shrink about 3x.
    gzip on;
    gzip_types application/json application/javascript text/css application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Security headers (repeated in each location with its own add_header: nginx does
    # not inherit them there).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'" always;

    # Hashed file names never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Data files keep their names and change weekly: always revalidate.
    location /data/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Optional: funding data only from the UiS network/VPN (the files stay encrypted
    # either way). Check the UiS address ranges with IT before enabling.
    # location ~ ^/data/funding { allow 152.94.0.0/16; deny all; }
}
